<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foglio del conduttore</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,800&family=Archivo:wght@400;600;800&display=swap">
<style>
:root { --paper: #fbf7ee; --ink: #1f1b16; --soft: #6b6255; --line: #e2d8c3; --red: #d64a33; --blue: #3f7fe0; --ok: #2f9d66; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 "Archivo", "Segoe UI", system-ui, sans-serif;
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: "Bodoni Moda", Georgia, serif; font-size: 2.2em; margin: 0; line-height: 1.05; }
h2 { font-size: .8em; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); margin: 18px 0 0; }
.warn { margin: 0; color: var(--soft); }
.q { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; background: #fff; }
.head { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .8em; color: var(--soft); }
.head b { color: var(--ink); }
.who { font-weight: 800; }
.who.r { color: var(--red); } .who.b { color: var(--blue); } .who.e { color: var(--ink); }
.text { margin: 0; }
.ans { margin: 0; font-weight: 800; color: var(--ok); font-size: 1.1em; }
</style>
</head>
<body>
<main>
  <h1>Foglio del conduttore</h1>
  <p class="warn">Le risposte di tutte le domande. Tenetelo sul telefono e non fatelo vedere alle squadre.</p>
  <div id="list"></div>
</main>
<script src="domande.js"></script>
<script>
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const L = ["A", "B", "C", "D"];
  let t = 0, tappa = null, html = "";
  DOMANDE.forEach((q, i) => {
    if (q.tappa !== tappa) { tappa = q.tappa; html += `<h2>${TAPPE[tappa]}</h2>`; }
    let who;
    if (q.modo === "singola") { who = t === 0 ? `<span class="who r">Squadra rossa</span>` : `<span class="who b">Squadra blu</span>`; t = 1 - t; }
    else who = `<span class="who e">Tutte e due</span>`;
    const ans = q.tipo === "multipla" ? `${L[q.corretta]}. ${q.opzioni[q.corretta]}` : q.tipo === "vf" ? q.opzioni[q.corretta] : q.risposta;
    html += `<div class="q"><div class="head"><b>${i + 1}.</b><span>${esc(q.regione)}</span>${who}${q.difficile ? "<span>★ difficile</span>" : ""}</div>
      <p class="text">${esc(q.testo)}</p><p class="ans">${esc(ans)}</p></div>`;
  });
  document.getElementById("list").innerHTML = html;
</script>
</body>
</html>
